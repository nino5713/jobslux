# Domaine : jobslux.com

server {
    listen 80;
    server_name jobslux.com www.jobslux.com;

    # Redirection forcée vers HTTPS (obligatoire pour la géolocalisation)
    location / {
        return 301 https://$host$request_uri;
    }

    # Nécessaire pour le renouvellement Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}

server {
    listen 443 ssl http2;
    server_name jobslux.com www.jobslux.com;

    ssl_certificate     /etc/letsencrypt/live/jobslux.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jobslux.com/privkey.pem;

    client_max_body_size 20M;  # pour l'upload de photos

    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;

        # Support WebSocket (indispensable pour le chat Flask-SocketIO)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400;  # connexions WebSocket longues
    }
}
