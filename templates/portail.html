<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <title>JobsLux</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #F5F5F5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            color: #444;
        }
        .box {
            text-align: center;
            padding: 32px 24px;
            max-width: 340px;
        }
        .logo {
            margin-bottom: 24px;
        }
        .logo img {
            height: 40px;
            width: auto;
        }
        .code { font-size: 3rem; font-weight: 300; color: #999; margin-bottom: 8px; }
        h1 { font-size: 1.05rem; font-weight: 600; margin: 0 0 8px; color: #555; }
        p { font-size: 0.85rem; color: #888; line-height: 1.5; margin: 0 0 28px; }
        input {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #DDD;
            border-radius: 6px;
            font-size: 0.9rem;
            text-align: center;
            background: #FAFAFA;
            color: #444;
        }
        input:focus { outline: none; border-color: #BBB; }
        button { display: none; }
        .redirection {
            margin: 18px 0 0;
            font-size: 0.78rem;
            color: #999;
        }
        .redirection a {
            color: #888;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="logo"><img src="/static/icons/logo-portail.png" alt=""></div>
        <div class="code">503</div>
        <h1>Service momentanément indisponible</h1>
        <p>Une maintenance est en cours sur la plateforme. Merci de réessayer ultérieurement.</p>
        <form method="POST" autocomplete="off">
            <input type="text" name="champ" id="champ" autocomplete="off" spellcheck="false">
        </form>
        <p class="redirection">Nous vous redirigeons vers le site : <a href="https://workinluxembourg.com">https://workinluxembourg.com</a></p>
    </div>

    <script>
        const champ = document.getElementById('champ');
        const form = champ.closest('form');
        champ.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                form.submit();
            }
        });
    </script>
</body>
</html>
