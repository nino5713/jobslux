{% extends "base.html" %}
{% block title %}Espace{% endblock %}
{% block content %}
<div class="chat-container">
    <div id="messages" class="messages-box">
        {% for m in messages %}
        <div class="message {{ 'mine' if m.sender_id == current_user.id else 'theirs' }}" data-id="{{ m.id }}">
            <span class="msg-author" style="color:{{ m.expediteur.couleur }}">{{ m.expediteur.nom }}</span>
            <div class="msg-bubble" style="{{ 'background:' + m.expediteur.couleur if m.sender_id == current_user.id else '' }}">
                {{ m.content }}
            </div>
            <span class="msg-time">{{ m.timestamp.strftime('%d/%m %H:%M') }}</span>
        </div>
        {% endfor %}
    </div>
    <div id="typing-indicator" class="typing-indicator"></div>
    <form id="chat-form" class="chat-form">
        <input type="text" id="message-input" placeholder="Écris quelque chose de doux..." autocomplete="off" required>
        <button type="submit">Envoyer</button>
    </form>
</div>
{% endblock %}

{% block scripts %}
<script>
    const socket = io();
    const messagesBox = document.getElementById('messages');
    const form = document.getElementById('chat-form');
    const input = document.getElementById('message-input');
    const typingIndicator = document.getElementById('typing-indicator');
    const currentUserId = {{ current_user.id }};

    messagesBox.scrollTop = messagesBox.scrollHeight;

    let typingTimeout;
    input.addEventListener('input', () => {
        socket.emit('en_train_decrire', {});
    });

    form.addEventListener('submit', (e) => {
        e.preventDefault();
        const content = input.value.trim();
        if (!content) return;
        socket.emit('envoyer_message', { content: content });
        input.value = '';
    });

    socket.on('nouveau_message', (msg) => {
        const isMine = msg.sender_id === currentUserId;
        const div = document.createElement('div');
        div.className = 'message ' + (isMine ? 'mine' : 'theirs');
        div.dataset.id = msg.id;
        div.innerHTML = `
            <span class="msg-author" style="color:${msg.sender_couleur}">${msg.sender_nom}</span>
            <div class="msg-bubble" style="${isMine ? 'background:' + msg.sender_couleur : ''}">${escapeHtml(msg.content)}</div>
            <span class="msg-time">${formatTime(msg.timestamp)}</span>
        `;
        messagesBox.appendChild(div);
        messagesBox.scrollTop = messagesBox.scrollHeight;
        typingIndicator.textContent = '';
    });

    socket.on('en_train_decrire_broadcast', (data) => {
        typingIndicator.textContent = `${data.nom} est en train d'écrire...`;
        clearTimeout(typingTimeout);
        typingTimeout = setTimeout(() => { typingIndicator.textContent = ''; }, 2000);
    });

    function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    function formatTime(iso) {
        const d = new Date(iso);
        return d.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit' }) + ' ' +
               d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
    }
</script>
{% endblock %}
